<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>자막 편집기 · v3</title>
<style>
  :root{
    --bg:#06070a; --bg2:#0a0c11;
    --panel:#0e1117; --panel2:#151a24; --panel3:#1d2430;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
    --txt:#eef2f8; --dim:#8b95a7; --dim2:#5d6678;
    --lime:#d4ff33; --limeDk:#1a2105;
    --bad:#ff7b87;
    --pad:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    overflow:hidden;position:fixed;inset:0;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
    letter-spacing:-.2px;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;}
  input,textarea{font-family:inherit;}
  .app{
    height:100vh;height:100dvh;width:100%;max-width:560px;margin:0 auto;
    display:flex;flex-direction:column;overflow:hidden;background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom);
  }
  @media (min-width:620px){
    .app{max-width:680px;box-shadow:0 0 0 1px rgba(255,255,255,.05);}
  }

  /* ================= top bar ================= */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(9px + env(safe-area-inset-top)) 16px 11px;
  }
  .mark::after{
    content:"";width:0;height:0;margin-left:2px;
    border-left:7px solid #1a2105;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .mark{
    width:24px;height:24px;border-radius:8px;flex:0 0 auto;
    background:linear-gradient(155deg,#f2ff9c,#cbe93f 58%,#a4cb22);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 12px rgba(200,240,70,.2);
  }
  .brand .bt{font-size:14px;font-weight:860;letter-spacing:-.5px;white-space:nowrap;}
  .brand .ver{
    font-size:9px;font-weight:900;color:#1a2105;background:var(--lime);
    padding:1.5px 4.5px;border-radius:4px;margin-left:5px;vertical-align:2px;
  }
  .hacts{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .tb{
    height:34px;padding:0 12px;border-radius:10px;background:var(--panel2);
    border:1px solid var(--line);font-size:12px;font-weight:800;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    transition:transform .12s,background .12s;
  }
  .tb:active{transform:scale(.96);background:var(--panel3);}
  .tb.ask{background:#1a1e11;border-color:#39421f;color:#eaf7ac;padding:0 11px;}
  .tb.pri{background:var(--lime);border-color:transparent;color:var(--limeDk);font-weight:900;padding:0 13px;}
  .tb.pri:active{background:#c8e34f;}
  .tb.more{width:34px;padding:0;justify-content:center;font-size:15px;letter-spacing:1px;color:#c9d2e2;}
  @media (max-width:400px){
    .brand .bt{font-size:13px;}
    .tb.ask{padding:0 9px;font-size:11.5px;}
    .tb.pri{padding:0 10px;font-size:11.5px;}
    .hacts{gap:6px;}
  }

  /* ================= stage ================= */
  .stagewrap{
    flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:8px 18px 14px;position:relative;
  }
  .stage{
    position:relative;flex:0 0 auto;background:#000;border-radius:16px;overflow:hidden;
    box-shadow:0 18px 48px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.07);
    touch-action:manipulation;
  }
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block;}
  .titleLayer{
    position:absolute;left:0;right:0;top:7%;display:flex;justify-content:center;
    padding:0 8%;pointer-events:none;
  }
  .titleBox{
    max-width:100%;color:#fff;font-weight:900;line-height:1.16;text-align:center;
    letter-spacing:-.045em;word-break:keep-all;overflow-wrap:anywhere;
    text-shadow:0 2px 6px rgba(0,0,0,.55),0 0 20px rgba(0,0,0,.4);
  }
  .titleBox span{display:block;white-space:pre-wrap;}
  .titleBox:empty{display:none;}
  .subLayer{
    position:absolute;left:0;right:0;bottom:var(--sy,20%);display:flex;justify-content:center;
    padding:0 6%;pointer-events:none;transition:bottom .08s linear;
  }
  .sub{
    max-width:100%;text-align:center;font-weight:900;line-height:1.18;
    letter-spacing:-.04em;word-break:keep-all;overflow-wrap:anywhere;
  }
  .sub span{display:block;white-space:pre-wrap;}
  .sub:empty{display:none;}
  .sub[data-style="box"]{
    background:rgba(255,255,255,.965);color:#070707;
    padding:.28em .52em;border-radius:.3em;box-shadow:0 3px 14px rgba(0,0,0,.42);
  }
  .sub[data-style="bar"]{
    background:rgba(7,9,14,.74);color:#fff;
    padding:.32em .72em;border-radius:.28em;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 3px 16px rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .sub[data-style="outline"]{
    background:transparent;color:#fff;padding:.08em .18em;
    text-shadow:
      -2px 0 2px #000,2px 0 2px #000,0 -2px 2px #000,0 2px 2px #000,
      -1px -1px 2px #000,1px 1px 2px #000,-1px 1px 2px #000,1px -1px 2px #000,
      0 3px 10px rgba(0,0,0,.7);
  }
  .badge{
    position:absolute;font-size:9.5px;font-weight:800;color:#cfd6e2;
    background:rgba(8,9,12,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    padding:3px 8px;border-radius:20px;pointer-events:none;
    border:1px solid rgba(255,255,255,.09);font-variant-numeric:tabular-nums;
  }
  .badge.tr{right:8px;top:8px;}
  .bigplay{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);
    width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.93);color:#08090c;font-size:20px;padding-left:3px;
    box-shadow:0 8px 26px rgba(0,0,0,.5);
    transition:opacity .2s,transform .2s;
  }
  body.touched .bigplay{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.86);}

  /* ================= transport ================= */
  .transport{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:0 18px 12px;
  }
  .clock{display:flex;align-items:baseline;min-width:0;}
  .clock b{font-size:22px;font-weight:880;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:#fff;}
  .clock .u{font-size:11px;font-weight:800;color:var(--dim);margin:0 5px 0 1px;}
  .clock .tot{font-size:11px;font-weight:700;color:var(--dim2);font-variant-numeric:tabular-nums;}
  .tsp{margin-left:auto;display:flex;align-items:center;gap:7px;}
  .chipctrl{
    height:33px;padding:0 11px;border-radius:10px;background:var(--panel2);
    border:1px solid var(--line);font-size:11px;font-weight:800;color:#c8d1e1;
    font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.1px;
    transition:transform .12s,background .12s,color .12s;
  }
  .chipctrl:active{transform:scale(.95);background:var(--panel3);}
  .chipctrl.on{color:var(--lime);border-color:#3b4423;background:#181d12;}
  .playbtn{
    width:42px;height:42px;border-radius:50%;background:#f4f7fb;color:#08090c;
    font-size:15px;display:grid;place-items:center;padding-left:2px;
    box-shadow:0 4px 16px rgba(0,0,0,.35);transition:transform .12s,background .12s;
  }
  .playbtn:active{transform:scale(.94);background:#dfe4ee;}

  /* ================= timeline ================= */
  .timeline{flex:0 0 auto;display:flex;flex-direction:column;min-height:0;padding:2px 0 0;}
  .tlscroll{
    overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;
    padding-bottom:2px;
  }
  .tlscroll::-webkit-scrollbar{height:0;display:none;}
  .tlcontent{position:relative;height:132px;}
  .ruler{position:relative;height:18px;margin:0 var(--pad);touch-action:none;cursor:pointer;}
  .ruler .tick{position:absolute;bottom:0;width:1px;height:4px;background:rgba(255,255,255,.12);}
  .ruler .tick.mj{background:rgba(255,255,255,.26);height:7px;}
  .ruler .tick i{position:absolute;top:-10px;left:3px;font-style:normal;font-size:8.5px;font-weight:750;color:#6b7486;font-variant-numeric:tabular-nums;}
  .media{
    position:relative;height:56px;margin:0 var(--pad);border-radius:10px;overflow:hidden;
    background:#0b0e14;border:1px solid var(--line);
  }
  .media canvas{display:block;}
  #thumbCv{position:absolute;left:0;top:0;height:26px;width:100%;}
  .wave{position:absolute;left:0;right:0;top:26px;bottom:0;overflow:hidden;background:linear-gradient(180deg,#0f1420,#0a0e17);}
  .wave .wvbase,.wave .wvprog{position:absolute;left:0;top:0;height:100%;}
  .wvclip{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden;}
  .wvmsg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:750;color:#4f5a6d;letter-spacing:.2px;pointer-events:none;
  }
  .track{
    position:relative;height:52px;margin:5px var(--pad) 0;border-radius:10px;
    background:linear-gradient(180deg,#0f131a,#0b0e14);
    border:1px solid var(--line);overflow:hidden;touch-action:pan-x;
  }
  .track .grid{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.035);pointer-events:none;}
  .seg{
    position:absolute;top:6px;bottom:6px;border-radius:7px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    padding:3px 6px;
    background:linear-gradient(180deg,#252d3a,#1b222c);
    border:1px solid rgba(255,255,255,.085);
    box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.045);
    touch-action:none;cursor:grab;
    transition:box-shadow .12s,background .12s;
  }
  .seg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:#6b7d99;opacity:.85;}
  .seg .sx{font-size:9px;font-weight:750;line-height:1.3;color:#dde4ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seg .g{position:absolute;top:0;bottom:0;width:12px;display:none;align-items:center;justify-content:center;}
  .seg .g.l{left:0;} .seg .g.r{right:0;}
  .seg .g::after{content:"";width:2px;height:16px;border-radius:2px;background:rgba(255,255,255,.8);}
  .seg.sel{
    background:linear-gradient(180deg,#394418,#2a3315);
    box-shadow:0 0 0 2px var(--lime),0 0 16px rgba(212,255,51,.28);
    z-index:3;border-color:transparent;
  }
  .seg.sel::before{background:var(--lime);opacity:1;}
  .seg.sel .sx{color:#f2fad2;}
  .seg.sel .g{display:flex;}
  .seg.live{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85);z-index:2;}
  .seg.sel.live{box-shadow:0 0 0 2px var(--lime),0 0 16px rgba(212,255,51,.28),inset 0 0 0 1.5px rgba(255,255,255,.5);}
  .seg.ov{outline:1.5px dashed rgba(255,123,135,.9);outline-offset:-2px;}
  .seg.drg{opacity:.92;cursor:grabbing;z-index:6;}
  .playhead{position:absolute;top:0;bottom:0;left:var(--pad);width:0;z-index:7;pointer-events:none;will-change:transform;}
  .playhead .line{position:absolute;left:-1px;top:14px;bottom:0;width:2px;background:var(--lime);box-shadow:0 0 8px rgba(212,255,51,.6);}
  .playhead .head{
    position:absolute;top:0;left:-18px;width:36px;height:14px;pointer-events:auto;
    touch-action:none;cursor:ew-resize;display:flex;align-items:center;justify-content:center;
  }
  .playhead .head i{
    font-style:normal;min-width:32px;height:14px;padding:0 4px;border-radius:4px;
    background:var(--lime);color:var(--limeDk);text-align:center;
    font-size:8px;font-weight:900;line-height:14px;font-variant-numeric:tabular-nums;
    box-shadow:0 2px 8px rgba(0,0,0,.55);
  }

  /* ================= dock ================= */
  .dock{
    flex:0 0 auto;background:linear-gradient(180deg,#0d1015,#080a0e);
    border-top:1px solid var(--line);
    padding:11px 18px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:9px;
  }
  .dockhead{display:flex;align-items:center;gap:6px;min-height:20px;}
  .selTag{
    font-size:10.5px;font-weight:800;color:#98a3b5;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;min-width:0;
  }
  .selTag.new{color:var(--lime);}
  .selTag b{color:#dfe6f2;font-weight:850;}
  .iconact{
    width:30px;height:28px;border-radius:8px;display:grid;place-items:center;
    font-size:13px;color:#cfd7e4;background:var(--panel2);border:1px solid var(--line);
    flex:0 0 auto;
  }
  .iconact.del{background:#1b1215;border-color:#37202a;color:#ff9aa5;}
  .iconact:active{transform:scale(.94);}
  textarea#ta{
    width:100%;height:46px;resize:none;border-radius:11px;padding:8px 11px;
    background:#0a0e14;border:1px solid #232a36;color:#fff;
    font-size:16px;font-weight:700;line-height:1.35;letter-spacing:-.3px;outline:none;
    -webkit-user-select:text;user-select:text;transition:border-color .15s,box-shadow .15s;
  }
  textarea#ta::placeholder{color:#49515f;font-weight:600;font-size:12.5px;}
  textarea#ta:focus{border-color:#5e6c31;box-shadow:0 0 0 3px rgba(212,255,51,.09);background:#0a0f08;}
  .applybtn{
    width:100%;height:42px;border-radius:11px;background:var(--lime);color:var(--limeDk);
    font-size:13px;font-weight:900;letter-spacing:-.2px;
    transition:transform .12s,opacity .12s;
  }
  .applybtn:active{transform:scale(.985);background:#c8e34f;}
  .applybtn:disabled{opacity:.28;}

  /* ================= sheets ================= */
  .scrim{position:fixed;inset:0;background:rgba(3,4,6,.7);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  .scrim.on{opacity:1;pointer-events:auto;}
  .scrim.clear{background:rgba(3,4,6,.24);-webkit-backdrop-filter:none;backdrop-filter:none;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90%;
    background:#0d1015;border-radius:20px 20px 0 0;border-top:1px solid var(--line2);
    transform:translateY(103%);transition:transform .24s cubic-bezier(.2,.85,.25,1);
    display:none;flex-direction:column;max-width:560px;margin:0 auto;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 50px rgba(0,0,0,.65);
  }
  .sheet.show{display:flex;}
  .sheet.on{transform:translateY(0);}
  .sheet.compact{max-height:68%;}
  .sheet .grab{width:36px;height:4px;border-radius:3px;background:#2b3240;margin:8px auto 0;flex:0 0 auto;}
  .sheet .sh{display:flex;align-items:center;gap:8px;padding:11px 20px 9px;flex:0 0 auto;}
  .sheet .sh b{font-size:15.5px;font-weight:880;letter-spacing:-.4px;}
  .sheet .sh button.x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--panel3);font-size:12px;color:#cfd6e4;display:grid;place-items:center;}
  .sheet .sb{padding:0 20px 6px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;}
  .sheet .sf{padding:10px 20px 0;flex:0 0 auto;border-top:1px solid var(--line);}
  .mi{width:100%;display:flex;align-items:center;gap:12px;padding:12px 6px;border-radius:10px;font-size:13.5px;font-weight:750;color:#e7ecf5;text-align:left;}
  .mi:active{background:var(--panel2);}
  .mi .ic{width:22px;text-align:center;font-size:15px;flex:0 0 auto;}
  .mi .sub{display:block;font-size:10.5px;font-weight:650;color:var(--dim2);margin-top:3px;}
  .mi.danger{color:#ff9aa5;}
  .mi.disabled{opacity:.35;pointer-events:none;}
  .mi .rt{margin-left:auto;font-size:11px;font-weight:800;color:var(--dim2);}
  .note{font-size:10.5px;color:var(--dim2);line-height:1.65;margin:10px 2px 2px;}
  .grp{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;}

  .lbl{display:block;font-size:10px;font-weight:850;color:var(--dim2);letter-spacing:.4px;text-transform:uppercase;margin:14px 0 6px 2px;}
  .lbl:first-child{margin-top:4px;}
  .fld{width:100%;height:42px;border-radius:10px;padding:0 12px;background:#0a0e14;border:1px solid #232a36;color:#fff;font-size:15px;font-weight:750;outline:none;-webkit-user-select:text;user-select:text;}
  .fld:focus{border-color:#5e6c31;box-shadow:0 0 0 3px rgba(212,255,51,.09);}
  .segstyle{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;}
  .segstyle button{flex:1 1 0;height:34px;border-radius:8px;font-size:11.5px;font-weight:800;color:var(--dim);}
  .segstyle button.on{background:#2b323e;color:#fff;}
  .sliderRow{display:flex;align-items:center;gap:10px;margin-top:2px;}
  .sliderRow .lb{font-size:10.5px;font-weight:850;color:var(--dim2);white-space:nowrap;}
  .sliderRow b{font-size:11px;font-weight:850;color:#cfd7e4;min-width:34px;text-align:right;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;height:24px;background:transparent;outline:none;}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#2a323e;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--lime);margin-top:-6.5px;box-shadow:0 2px 6px rgba(0,0,0,.5);}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#2a323e;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--lime);}
  .stylepreview{font-size:10.5px;color:var(--dim2);line-height:1.6;margin:12px 2px 0;}

  /* ask sheet */
  .askhead{display:flex;align-items:center;gap:10px;padding:0 0 12px;}
  .askava{width:34px;height:34px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font-size:17px;background:linear-gradient(155deg,#2a3520,#14180f);border:1px solid #3d4924;}
  .askhead .tx{min-width:0;font-size:11px;font-weight:650;color:var(--dim2);line-height:1.5;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    height:32px;padding:0 11px;border-radius:16px;background:var(--panel2);
    border:1px solid var(--line2);font-size:11.5px;font-weight:750;color:#dde4f0;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .chip:active{transform:scale(.96);border-color:#5e6c31;}
  .askbox{padding:11px 0 0;}
  .askbox textarea{
    width:100%;height:72px;resize:none;border-radius:12px;padding:10px 11px;
    background:#0a0e14;border:1px solid #232a36;color:#fff;font-size:15px;font-weight:650;
    line-height:1.42;letter-spacing:-.3px;outline:none;-webkit-user-select:text;user-select:text;
  }
  .askbox textarea::placeholder{color:#49515f;font-size:12px;font-weight:600;}
  .askbox textarea:focus{border-color:#5e6c31;background:#0a0f08;box-shadow:0 0 0 3px rgba(212,255,51,.09);}
  .swrow{display:flex;align-items:center;gap:9px;padding:11px 0 0;font-size:11.5px;font-weight:750;color:#c9d2e0;}
  .swrow .n{margin-left:auto;font-size:10px;font-weight:800;color:var(--dim2);font-variant-numeric:tabular-nums;}
  .sw{position:relative;width:40px;height:23px;border-radius:12px;background:#262c38;transition:background .16s;flex:0 0 auto;}
  .sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#8d97a8;transition:transform .16s,background .16s;}
  .sw.on{background:#43501f;}
  .sw.on::after{transform:translateX(17px);background:var(--lime);}
  .prevwrap{padding:11px 0 0;}
  .prev{
    max-height:148px;overflow:auto;border-radius:10px;padding:10px 11px 16px;
    -webkit-mask-image:linear-gradient(180deg,#000 84%,transparent);
    mask-image:linear-gradient(180deg,#000 84%,transparent);
    background:#080b10;border:1px solid #1c222c;color:#a9b3c4;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.62;
    white-space:pre-wrap;-webkit-user-select:text;user-select:text;
  }
  .prev .h{color:var(--lime);}
  .askfoot{display:flex;gap:7px;padding:12px 0 0;}
  .askfoot button{height:46px;border-radius:12px;font-size:12.5px;font-weight:880;display:flex;align-items:center;justify-content:center;gap:5px;}
  .askfoot .copy{flex:1 1 auto;background:var(--lime);color:var(--limeDk);}
  .askfoot .share{flex:0 0 88px;background:var(--panel2);border:1px solid var(--line2);color:#dfe6f2;}
  .askfoot button:active{transform:scale(.97);}
  .flash{animation:flash .5s;}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(212,255,51,.6);}100%{box-shadow:0 0 0 12px rgba(212,255,51,0);}}

  /* export */
  .exp{width:100%;height:126px;resize:none;border-radius:10px;padding:10px;background:#080b10;border:1px solid #1e2530;color:#c5cede;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.58;-webkit-user-select:text;user-select:text;}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px;}
  .btns button{height:42px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;font-weight:850;color:#dfe6f2;}
  .btns button.pri{background:var(--lime);border-color:transparent;color:var(--limeDk);}
  .btns button:active{transform:scale(.97);}

  #toast{
    position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    background:rgba(17,20,26,.97);border:1px solid #2f3745;color:#eef2f9;font-size:11.5px;font-weight:750;
    padding:9px 15px;border-radius:11px;z-index:60;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;max-width:86vw;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  #toast.on{opacity:1;transform:translate(-50%,0);}
  .vhidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;border:0;padding:0;margin:-1px;}

  #banner{
    position:fixed;left:10px;right:10px;top:calc(6px + env(safe-area-inset-top));z-index:70;
    background:#1b1410;border:1px solid #4a3221;color:#ffd9b0;border-radius:11px;
    padding:9px 11px;font-size:10.5px;font-weight:650;line-height:1.5;display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #banner.on{display:flex;gap:8px;align-items:flex-start;}
  #banner b{color:#ffb877;}
  #banner .x{margin-left:auto;color:#c79b6e;font-size:13px;padding:0 2px;flex:0 0 auto;}

  @media (max-height:720px){
    .topbar{padding:calc(6px + env(safe-area-inset-top)) 14px 8px;}
    .stagewrap{padding:2px 14px 8px;}
    .transport{padding:0 16px 8px;}
    .dock{padding:9px 16px calc(9px + env(safe-area-inset-bottom));gap:7px;}
    .applybtn{height:40px;}
    .tlcontent{height:118px;}
    .track{height:46px;}
    .media{height:52px;}
    #thumbCv{height:24px;} .wave{top:24px;}
    textarea#ta{height:40px;}
    .dock{padding-top:9px;}
  }
</style>
</head>

    subs: S.subs.map(function(s){ return { id: s.id, s: s.s, e: s.e, t: s.t }; })
  });
}
function pushUndo(){
  undoStack.push(snapshot());
  if (undoStack.length > 60) undoStack.shift();
}
function undo(){
  if (!undoStack.length) { toast("되돌릴 편집이 없어요"); return; }
  var o = JSON.parse(undoStack.pop());
  S.name = o.name; S.title = o.title; S.style = o.style; S.subY = o.subY;
  S.subs = o.subs.map(function(x){ return { id: x.id, s: x.s, e: x.e, t: x.t }; });
  uid = Math.max(uid, S.subs.reduce(function(m,s){ return Math.max(m, s.id + 1); }, 1));
  ed = { mode: "none", id: null, s: cur, e: cur, t: "", dirty: false };
  applyStyle(); renderTitle(); layoutTimeline(); syncEditor(); persist();
  toast("되돌렸어요");
}

/* ============================================================
   시간 / 재생
   ============================================================ */
function pps(){
  var w = el.tlScroll.clientWidth || 360;
  var fit = Math.max(3, (w - PAD*2) / Math.max(0.4, S.dur));
  return fit * zoom;
}
function setTime(t, silent){
  cur = clamp(t, 0, S.dur);
  if (el.video.readyState >= 1) {
    try { if (Math.abs(el.video.currentTime - cur) > 0.03) { seeking = true; el.video.currentTime = cur; } } catch(e){}
  }
  updateUI();
  if (!silent && !playing) syncEditor();
}
function nudge(d){
  if (playing) pause();
  markGesture();
  setTime(cur + d);
}
function play(){
  if (playing) return;
  markGesture();
  var p = el.video.play();
  if (p && p.catch) p.catch(function(){ toast("재생이 막혔어요 · 화면을 한 번 탭해 주세요"); });
  playing = true;
  document.body.classList.add("playing");
  updateUI();
}
function pause(){
  if (!playing) return;
  playing = false;
  try { el.video.pause(); } catch(e){}
  document.body.classList.remove("playing");
  updateUI();
  syncEditor();
}
function togglePlay(){ playing ? pause() : play(); }
function markGesture(){
  if (!hasGesture) { hasGesture = true; document.body.classList.add("touched"); }
}

var uiActive = -2;
function updateUI(){
  var t = cur;
  el.nowT.textContent = fmt(t);
  el.totT.textContent = S.dur.toFixed(1);
  el.btnPlay.textContent = playing ? "❚❚" : "▶";
  var P = pps(), x = t * P, W = S.dur * P;
  el.playhead.style.transform = "translateX(" + x.toFixed(1) + "px)";
  var shift = x < 18 ? (18 - x) : (x > W - 18 ? (W - 18) - x : 0);
  el.phHead.style.left = (-18 + shift).toFixed(1) + "px";
  el.phT.textContent = fmt(t);
  el.wvClip.style.width = Math.max(0, t * P).toFixed(1) + "px";

  var a = activeAt(t);
  var aid = a ? a.id : null;
  if (aid !== uiActive) {
    uiActive = aid;
    var nodes = el.track.querySelectorAll(".seg");
    for (var i=0;i<nodes.length;i++) nodes[i].classList.toggle("live", aid !== null && Number(nodes[i].dataset.id) === aid);
  }
  updateOverlay();
  if (playing) ensureVisible(t * P);
}
function ensureVisible(x){
  var sc = el.tlScroll, w = sc.clientWidth, sl = sc.scrollLeft;
  if (x < sl + 24) sc.scrollLeft = Math.max(0, x - 24);
  else if (x > sl + w - 52) sc.scrollLeft = Math.max(0, x - w * 0.55);
}
function activeAt(t){
  for (var i=0;i<S.subs.length;i++){
    var s = S.subs[i];
    if (t >= s.s - 0.015 && t <= s.e + 0.015) return s;
  }
  return null;
}

/* ============================================================
   스테이지 / 오버레이
   ============================================================ */
function layoutStage(){
  var box = el.stageCol;
  var padX = window.innerWidth > 620 ? 64 : 36, padY = window.innerWidth > 620 ? 40 : 16;
  var W = Math.max(90, box.clientWidth - padX);
  var H = Math.max(90, box.clientHeight - padY);
  var sw = W, sh = sw / stageAR;
  if (sh > H) { sh = H; sw = sh * stageAR; }
  el.stage.style.width = Math.round(sw) + "px";
  el.stage.style.height = Math.round(sh) + "px";
  el.subBox.style.fontSize = clamp(Math.round(sh * 0.040), 11, 32) + "px";
  el.titleBox.style.fontSize = clamp(Math.round(sh * 0.053), 12, 40) + "px";
}
function renderTitle(){
  var lines = splitLines(S.title);
  if (!lines.length) { el.titleBox.innerHTML = ""; return; }
  var h = "";
  lines.slice(0,3).forEach(function(l){ h += "<span>" + esc(l) + "</span>"; });
  if (el.titleBox.innerHTML !== h) el.titleBox.innerHTML = h;
}
function applyStyle(){
  el.subBox.dataset.style = S.style;
  el.subLayer.style.setProperty("--sy", S.subY + "%");
  var y = $("subY"), yv = $("subYv"), ss = $("styleSel");
  if (y) y.value = S.subY;
  if (yv) yv.textContent = S.subY + "%";
  if (ss) {
    var kids = ss.querySelectorAll("button");
    for (var i=0;i<kids.length;i++) kids[i].classList.toggle("on", kids[i].dataset.st === S.style);
  }
}
function updateOverlay(){
  var inRange = ed.mode !== "none" && cur >= ed.s - 0.02 && cur <= ed.e + 0.02;
  var txt = "";
  if (ed.mode !== "none" && (ed.dirty || inRange)) txt = ed.t;
  if (!txt.trim()) { var a = activeAt(cur); txt = a ? a.t : ""; }
  var ls = splitLines(txt);
  if (!ls.length) { el.subBox.innerHTML = ""; return; }
  var h = "";
  ls.slice(0,3).forEach(function(l){ h += "<span>" + esc(l) + "</span>"; });
  if (el.subBox.innerHTML !== h) el.subBox.innerHTML = h;
}

/* ============================================================
   타임라인 렌더
   ============================================================ */
function layoutTimeline(){
  var P = pps(), W = Math.max(24, S.dur * P);
  el.tlContent.style.width = (W + PAD*2) + "px";
  [el.ruler, el.media, el.track].forEach(function(n){ n.style.width = W + "px"; });
  renderRuler(P);
  renderTrack(P);
  drawThumbs(P, W);
  drawWave(P, W);
  updateUI();
}
function niceStep(P, minPx){
  var c = [0.1,0.2,0.5,1,2,5,10,15,30,60];
  for (var i=0;i<c.length;i++) if (c[i]*P >= minPx) return c[i];
  return 60;
}
function renderRuler(P){
  var step = niceStep(P, 46), minor = Math.min(step, niceStep(P, 9));
  var h = "";
  for (var t=0; t<=S.dur+1e-6; t+=minor){
    var major = Math.abs(t/step - Math.round(t/step)) < 1e-6;
    var lab = major ? (step < 1 ? t.toFixed(1) : Math.round(t) + "s") : "";
    h += '<div class="tick' + (major ? " mj" : "") + '" style="left:' + (t*P).toFixed(1) + 'px">' +
         (lab ? "<i>" + lab + "</i>" : "") + "</div>";
  }
  el.ruler.innerHTML = h;
}
function renderTrack(P){
  var grid = "";
  var step = niceStep(P, 46);
  for (var g=0; g<=S.dur+1e-6; g+=step) grid += '<div class="grid" style="left:' + (g*P).toFixed(1) + 'px"></div>';
  var ov = overlapIds();
  var h = grid;
  S.subs.forEach(function(s){
    var w = Math.max(6, Math.min(s.e, S.dur) * P - s.s * P - 1.5);
    var showX = w >= 34;
    h += '<div class="seg' + (ov[s.id] ? " ov" : "") + (ed.id === s.id ? " sel" : "") + '" data-id="' + s.id +
         '" style="left:' + (s.s*P).toFixed(1) + 'px;width:' + w.toFixed(1) + 'px">' +
         '<div class="g l"></div><div class="g r"></div>' +
         '<div class="sx">' + (showX ? esc(oneLine(s.t)) : "") + "</div></div>";
  });
  el.track.innerHTML = h;
  uiActive = -2;
  updateUI();
}
function overlapIds(){
  var out = {}, a = S.subs.slice().sort(function(x,y){ return x.s - y.s; });
  for (var i=0;i<a.length-1;i++) if (a[i].e > a[i+1].s + 0.001) { out[a[i].id] = 1; out[a[i+1].id] = 1; }
  return out;
}
function placeSeg(node, s, P){
  var w = Math.max(6, (Math.min(s.e, S.dur) - s.s) * P - 1.5);
  node.style.left = (s.s*P).toFixed(1) + "px";
  node.style.width = w.toFixed(1) + "px";
  var sx = node.querySelector(".sx");
  if (sx) sx.textContent = w >= 34 ? oneLine(s.t) : "";
}
function markSel(){
  var nodes = el.track.querySelectorAll(".seg");
  for (var i=0;i<nodes.length;i++) nodes[i].classList.toggle("sel", Number(nodes[i].dataset.id) === ed.id);
}

/* ============================================================
   썸네일 스트립
   ============================================================ */
function makeFrameCopy(c){
  if (window.createImageBitmap) return createImageBitmap(c).catch(function(){ return copyCanvas(c); });
  return Promise.resolve(copyCanvas(c));
}
function copyCanvas(c){
  var n = document.createElement("canvas");
  n.width = c.width; n.height = c.height;
  n.getContext("2d").drawImage(c, 0, 0);
  return n;
}
function seekTo(v, t){
  return new Promise(function(res){
    var done = false;
    function fin(){ if (done) return; done = true; v.removeEventListener("seeked", fin); clearTimeout(tm); res(); }
    var tm = setTimeout(fin, 700);
    v.addEventListener("seeked", fin);
    try { v.currentTime = t; } catch(e){ fin(); }
  });
}
async function genFrames(){
  frames = [];
  drawThumbs(pps(), S.dur * pps());
  var v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto";
  v.setAttribute("playsinline", "");
  v.src = S.src;
  try { await waitEvent(v, "loadeddata", 8000); } catch(e){ return; }
  var c = document.createElement("canvas");
  c.width = 72; c.height = 128;
  var ctx = c.getContext("2d");
  var step = S.dur > 90 ? 2 : 1;
  for (var t=0.04; t<S.dur; t+=step){
    await seekTo(v, Math.min(t, S.dur - 0.06));
    try { ctx.drawImage(v, 0, 0, 72, 128); } catch(e){ break; }
    frames.push({ t: t, cv: await makeFrameCopy(c) });
    if (frames.length % 10 === 0) drawThumbs(pps(), S.dur * pps());
  }
  drawThumbs(pps(), S.dur * pps());
  try { v.removeAttribute("src"); v.load(); } catch(e){}
}
function drawThumbs(P, W){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var H = 26;
  var Wc = Math.max(1, Math.round(W * dpr));
  var Hc = Math.round(H * dpr);
  if (el.thumbCv.width !== Wc) el.thumbCv.width = Wc;
  if (el.thumbCv.height !== Hc) el.thumbCv.height = Hc;
  el.thumbCv.style.width = W + "px";
  el.thumbCv.style.height = H + "px";
  var ctx = el.thumbCv.getContext("2d");
  ctx.clearRect(0, 0, Wc, Hc);
  if (!frames.length){
    ctx.fillStyle = "#0e1219";
    ctx.fillRect(0, 0, Wc, Hc);
    return;
  }
  var slot = Math.round(42 * dpr);
  for (var x=0; x<Wc; x+=slot){
    var tMid = ((x + slot/2) / dpr) / P;
    var f = nearestFrame(tMid);
    if (!f) continue;
    var iw = f.cv.width, ih = f.cv.height;
    var targetAR = slot / Hc;
    var sw = Math.min(iw, ih * targetAR), sh = sw / targetAR;
    if (sh > ih) { sh = ih; sw = sh * targetAR; }
    var sx = (iw - sw) / 2, sy = (ih - sh) / 2;
    try { ctx.drawImage(f.cv, sx, sy, sw, sh, x, 0, slot, Hc); } catch(e){}
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(x, 0, 1, Hc);
  }
}
function nearestFrame(t){
  if (!frames.length) return null;
  var lo = 0, hi = frames.length - 1;
  while (lo < hi){
    var mid = (lo + hi) >> 1;
    if (frames[mid].t < t) lo = mid + 1; else hi = mid;
  }
  if (lo > 0 && Math.abs(frames[lo-1].t - t) < Math.abs(frames[lo].t - t)) lo--;
  return frames[lo];
}

/* ============================================================
   오디오 파형
   ============================================================ */
async function buildWave(){
  if (el.video.readyState < 1) return;
  wvState = "loading";
  el.wvMsg.textContent = "파형 분석 중…";
  el.wvMsg.style.display = "flex";
  try {
    var buf;
    if (S.mediaFile) buf = await S.mediaFile.arrayBuffer();
    else {
      var res = await fetch(S.src, { cache: "force-cache" });
      if (!res.ok) throw new Error("http " + res.status);
      buf = await res.arrayBuffer();
    }
    if (!buf || buf.byteLength < 4096) throw new Error("empty");
    var AC = window.AudioContext || window.webkitAudioContext;
    var ac = new AC();
    var ab = await decodeAudio(ac, buf);
    try { ac.close(); } catch(e){}
    if (!ab || !ab.length) throw new Error("decode");
    var ch0 = ab.getChannelData(0);
    var ch1 = ab.numberOfChannels > 1 ? ab.getChannelData(1) : null;
    var sr = ab.sampleRate || 44100;
    var bucket = Math.max(1, Math.round(sr / PEAK_RATE));
    var n = Math.ceil(ch0.length / bucket);
    var arr = new Float32Array(n);
    for (var i=0;i<n;i++){
      var st = i*bucket, en = Math.min(ch0.length, st + bucket), mx = 0;
      for (var j=st;j<en;j+=2){
        var a0 = ch0[j] < 0 ? -ch0[j] : ch0[j];
        var a1 = ch1 ? (ch1[j] < 0 ? -ch1[j] : ch1[j]) : 0;
        var v = a0 > a1 ? a0 : a1;
        if (v > mx) mx = v;
      }
      arr[i] = mx;
    }
    peaks = arr;
    wvState = "ready";
    el.wvMsg.style.display = "none";
    drawWave(pps(), S.dur * pps());
  } catch(e){
    wvState = "fail";
    el.wvMsg.textContent = "파형 없음";
    el.wvMsg.style.display = "flex";
  }
}
function decodeAudio(ac, buf){
  return new Promise(function(res, rej){
    var settled = false;
    function ok(b){ if (settled) return; settled = true; res(b); }
    function bad(e){ if (settled) return; settled = true; rej(e || new Error("decode")); }
    try {
      var p = ac.decodeAudioData(buf, ok, bad);
      if (p && p.then) p.then(ok, bad);
    } catch(e){ bad(e); }
  });
}
function drawWave(P, W){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var Hc = Math.max(1, Math.round(30 * dpr));
  var Wc = Math.max(1, Math.round(W * dpr));
  [el.wvBase, el.wvProg].forEach(function(c){
    if (c.width !== Wc) c.width = Wc;
    if (c.height !== Hc) c.height = Hc;
    c.style.width = W + "px";
    c.style.height = "100%";
  });
  var cb = el.wvBase.getContext("2d"), cp = el.wvProg.getContext("2d");
  cb.clearRect(0, 0, Wc, Hc);
  cp.clearRect(0, 0, Wc, Hc);
  if (!peaks) return;
  var n = peaks.length, mid = Hc / 2, maxAmp = Hc * 0.44;
  for (var x=0; x<Wc; x++){
    var t = (x / dpr) / P;
    var idx = Math.floor(t * PEAK_RATE);
    if (idx < 0) idx = 0;
    if (idx >= n) break;
    var v = peaks[idx];
    var h = Math.max(1, v * maxAmp);
    cb.fillStyle = "rgba(126,146,178,.5)";
    cb.fillRect(x, mid - h, 1, h*2);
    cp.fillStyle = "rgba(212,255,51,.95)";
    cp.fillRect(x, mid - h, 1, h*2);
  }
}

/* ============================================================
   편집기 (dock)
   ============================================================ */
function suggestEnd(t){
  var e = t + 1.6, nxt = null;
  for (var i=0;i<S.subs.length;i++){
    var s = S.subs[i];
    if (s.id === ed.id) continue;
    if (s.s > t + 0.05 && (!nxt || s.s < nxt.s)) nxt = s;
  }
  if (nxt) e = Math.min(e, nxt.s - 0.03);
  if (e - t < 0.4) e = Math.min(t + 0.4, nxt ? nxt.s - 0.02 : S.dur);
  return r2(clamp(e, t + 0.05, S.dur));
}
function selectSub(sub, seek){
  if (seek) { if (playing) pause(); setTime(sub.s, true); }
  ed = { mode: "edit", id: sub.id, s: sub.s, e: sub.e, t: sub.t, dirty: false };
  renderEditor(); markSel(); updateOverlay();
  scrollToId(sub.id);
}
function newAt(t, seek){
  if (seek) { if (playing) pause(); setTime(t, true); }
  var s = r2(clamp(t, 0, S.dur));
  ed = { mode: "new", id: null, s: s, e: suggestEnd(s), t: "", dirty: false };
  renderEditor(); markSel(); updateOverlay();
}
function syncEditor(){
  if (ed.dirty) return;
  if (document.activeElement === el.ta) return;
  var a = activeAt(cur);
  if (a) {
    if (ed.mode !== "edit" || ed.id !== a.id) {
      ed = { mode:"edit", id:a.id, s:a.s, e:a.e, t:a.t, dirty:false };
      renderEditor(); markSel(); updateOverlay();
    }
  } else if (ed.mode !== "new" || Math.abs(ed.s - cur) > 0.05) {
    newAt(cur, false);
  }
}
function renderEditor(){
  var none = ed.mode === "none";
  var idx = (ed.mode === "edit") ? (S.subs.findIndex(function(x){ return x.id === ed.id; }) + 1) : 0;
  if (none) {
    el.selTag.innerHTML = "＋ 새 자막";
    el.selTag.classList.add("new");
  } else if (ed.mode === "new") {
    el.selTag.innerHTML = "＋ 새 자막 · <b>" + fmt(ed.s) + "s</b>부터";
    el.selTag.classList.add("new");
  } else {
    el.selTag.innerHTML = "#" + idx + " · <b>" + fmt(ed.s) + "–" + fmt(ed.e) + "s</b> · " + (ed.e - ed.s).toFixed(2) + "초";
    el.selTag.classList.remove("new");
  }
  var isEdit = ed.mode === "edit";
  el.btnSplit.style.display = isEdit ? "" : "none";
  el.btnDel.style.display = isEdit ? "" : "none";
  if (el.ta.value !== ed.t) el.ta.value = ed.t;
  el.ta.placeholder = "지금 " + fmt(cur) + "초 자막…  ( / 로 줄바꿈 )";
  el.btnApply.disabled = none || (!el.ta.value.trim() && ed.mode === "new");
  el.btnApply.textContent = (ed.mode === "new") ? "추가" : "적용";
}
el.ta.addEventListener("input", function(){
  if (ed.mode === "none") newAt(cur, false);
  ed.t = el.ta.value;
  ed.dirty = true;
  markGesture();
  renderEditor(); updateOverlay();
});
el.ta.addEventListener("focus", function(){
  markGesture();
  if (ed.mode === "none") newAt(cur, false);
});
el.ta.addEventListener("keydown", function(e){
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); applyEdit(); }
});
el.btnApply.addEventListener("click", applyEdit);
el.btnDel.addEventListener("click", deleteSub);
el.btnSplit.addEventListener("click", doSplit);

function applyEdit(){
  var txt = String(ed.t || "").replace(/[ \t]+$/mg, "").replace(/^\s+|\s+$/g, "");
  if (!txt) { toast("자막 내용을 입력해 주세요"); el.ta.focus(); return; }
  pushUndo();
  var wasNew = (ed.mode !== "edit");
  if (!wasNew) {
    var sub = S.subs.find(function(x){ return x.id === ed.id; });
    if (sub) { sub.s = ed.s; sub.e = ed.e; sub.t = txt; }
    ed.t = txt; ed.dirty = false;
  } else {
    if (ed.e - ed.s < 0.08) ed.e = suggestEnd(ed.s);
    var nu = { id: uid++, s: ed.s, e: ed.e, t: txt };
    S.subs.push(nu);
    ed = { mode: "edit", id: nu.id, s: nu.s, e: nu.e, t: nu.t, dirty: false };
  }
  sortSubs();
  layoutTimeline(); renderEditor(); scrollToId(ed.id); persist();
  toast(wasNew ? "자막을 추가했어요" : "적용했어요");
  el.ta.blur();
}
function deleteSub(){
  if (ed.mode === "none") { toast("삭제할 자막을 먼저 선택해 주세요"); return; }
  var id = ed.id;
  pushUndo();
  S.subs = S.subs.filter(function(x){ return x.id !== id; });
  ed = { mode: "none", id: null, s: cur, e: cur, t: "", dirty: false };
  layoutTimeline(); syncEditor(); persist();
  toast("삭제했어요 · ··· 에서 되돌리기");
}
function splitText(txt, frac){
  var lines = splitLines(txt);
  if (lines.length >= 2){
    var k = Math.max(1, Math.min(lines.length - 1, Math.round(lines.length * frac)));
    return [lines.slice(0, k).join(" / "), lines.slice(k).join(" / ")];
  }
  var words = String(txt).trim().split(/\s+/);
  if (words.length >= 2){
    var kw = Math.max(1, Math.min(words.length - 1, Math.round(words.length * frac)));
    return [words.slice(0, kw).join(" "), words.slice(kw).join(" ")];
  }
  return [String(txt).trim(), ""];
}
function doSplit(){
  if (playing) pause();
  var idx = S.subs.findIndex(function(s){ return cur > s.s + 0.05 && cur < s.e - 0.05; });
  if (idx < 0) { toast("재생헤드를 자막 안에 두고 눌러 주세요"); return; }
  var s = S.subs[idx], t = r2(cur);
  pushUndo();
  var parts = splitText(s.t, (t - s.s) / (s.e - s.s));
  var right = { id: uid++, s: t, e: s.e, t: parts[1] };
  s.e = t;
  if (parts[1]) s.t = parts[0];
  S.subs.push(right);
  sortSubs();
  layoutTimeline();

function scrollToId(id){

function mediaDurClamp(){
  S.subs.forEach(function(s){
    s.s = r2(clamp(s.s, 0, Math.max(0.1, S.dur - 0.1)));
    s.e = r2(clamp(s.e, s.s + 0.1, S.dur));
  });
}
el.video.addEventListener("loadedmetadata", function(){
  var d = el.video.duration;
  if (isFinite(d) && d > 0.2) S.dur = r2(d);
  var w = el.video.videoWidth || 540, h = el.video.videoHeight || 960;
  if (w && h) stageAR = w / h;
  mediaDurClamp();
  try { el.video.currentTime = Math.min(0.02, S.dur); } catch(e){}
  layoutStage(); layoutTimeline(); renderEditor(); updateOverlay();
  genFrames();
  buildWave();
});
el.video.addEventListener("play", function(){
  playing = true; markGesture();
  document.body.classList.add("playing");
  updateUI();
});
el.video.addEventListener("pause", function(){
  if (playing) { playing = false; document.body.classList.remove("playing"); updateUI(); }
  syncFromVideo(); syncEditor();
});
el.video.addEventListener("seeked", function(){ seeking = false; syncFromVideo(); });
el.video.addEventListener("timeupdate", function(){ if (!playing) syncFromVideo(); });
el.video.addEventListener("ended", function(){ cur = S.dur; pause(); });
el.video.addEventListener("error", function(){

});
function syncFromVideo(){
  if (!el.video.readyState) return;
  var t = clamp(el.video.currentTime || 0, 0, S.dur);
  if (Math.abs(t - cur) > 0.012) { cur = t; updateUI(); }
}
function loadVideoFile(file){
  if (!file) return;
  var ok = /^video\//i.test(file.type) || /\.(mp4|mov|m4v|webm)$/i.test(file.name);
  if (!ok) { bannerOn("이 파일은 영상이 아니에요. mp4 / mov 파일을 골라 주세요."); return; }
  var url;
  try { url = URL.createObjectURL(file); } catch(e){ bannerOn("영상 파일을 열 수 없어요. 다른 파일로 시도해 주세요."); return; }
  if (S.src && S.src.indexOf("blob:") === 0) { try { URL.revokeObjectURL(S.src); } catch(e){} }
  frames = []; peaks = null; wvState = "idle";
  S.mediaFile = file;
  S.src = url;
  S.name = file.name.replace(/\.[^.]+$/, "");
  el.video.removeAttribute("poster");
  el.video.src = url;
  try { el.video.load(); } catch(e){}
  drawThumbs(pps(), S.dur * pps());

  }, 5000);
}
function resetBuiltin(){
  if (S.src && S.src.indexOf("blob:") === 0) { try { URL.revokeObjectURL(S.src); } catch(e){} }

   재생 루프
   ============================================================ */
var lastF = performance.now();
function frame(now){
  var dt = (now - lastF) / 1000; lastF = now;
  if (playing) {
    if (el.video.readyState >= 2) cur = clamp(el.video.currentTime || 0, 0, S.dur);
    else { cur = clamp(cur + dt, 0, S.dur); if (cur >= S.dur - 0.001) { cur = S.dur; pause(); } }
    updateUI();
    if (cur >= S.dur - 0.02) pause();
  }
  requestAnimationFrame(frame);
}

function xToTime(clientX){
  var r = el.track.getBoundingClientRect();
  return clamp((clientX - r.left) / Math.max(1, r.width), 0, 1) * S.dur;
}
function bindScrub(node){
  var on = false;
  node.addEventListener("pointerdown", function(e){
    if (e.button > 0) return;
    on = true;
    try { node.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
    markGesture();
    if (playing) pause();
    setTime(xToTime(e.clientX));
  });
  node.addEventListener("pointermove", function(e){ if (on) { e.preventDefault(); setTime(xToTime(e.clientX)); } });
  function end(e){ if (!on) return; on = false; try { node.releasePointerCapture(e.pointerId); } catch(err){} }
  node.addEventListener("pointerup", end);
  node.addEventListener("pointercancel", end);
}
bindScrub(el.ruler);
bindScrub(el.phHead);

el.track.addEventListener("pointerdown", function(e){
  var seg = e.target.closest ? e.target.closest(".seg") : null;
  if (!seg) {
    drag = { mode: "bg", x0: e.clientX, y0: e.clientY, moved: false };
    return;
  }
  var id = Number(seg.dataset.id);
  var sub = S.subs.find(function(x){ return x.id === id; });
  if (!sub) return;
  if (playing) pause();
  markGesture();
  var rect = seg.getBoundingClientRect();
  var lx = e.clientX - rect.left;
  var edge = Math.min(14, rect.width * 0.3);
  var mode = "move";
  if (lx < edge) mode = "rs";
  else if (lx > rect.width - edge) mode = "re";
  drag = { mode: mode, id: id, x0: e.clientX, s0: sub.s, e0: sub.e, moved: false, node: seg, snap: false };
  try { seg.setPointerCapture(e.pointerId); } catch(err){}
  e.preventDefault();
  e.stopPropagation();
  if (ed.id !== id) {
    ed = { mode: "edit", id: sub.id, s: sub.s, e: sub.e, t: sub.t, dirty: false };
    renderEditor(); markSel(); updateOverlay();
  }
});
el.track.addEventListener("pointermove", function(e){
  if (!drag) return;
  var dx = e.clientX - drag.x0;
  if (drag.mode === "bg") { if (Math.abs(dx) > 6) drag.moved = true; return; }
  if (!drag.snap && Math.abs(dx) < 3) return;
  if (!drag.snap) { drag.snap = true; drag.node.classList.add("drg"); pushUndo(); }
  e.preventDefault();
  var sub = S.subs.find(function(x){ return x.id === drag.id; });
  if (!sub) return;
  var d = dx / pps();
  if (drag.mode === "move") {
    var len = drag.e0 - drag.s0;
    var ns = clamp(r2(drag.s0 + d), 0, Math.max(0, S.dur - len));
    sub.s = ns; sub.e = r2(ns + len);
  } else if (drag.mode === "rs") {
    sub.s = r2(clamp(drag.s0 + d, 0, sub.e - 0.1));
  } else {
    sub.e = r2(clamp(drag.e0 + d, sub.s + 0.1, S.dur));
  }
  placeSeg(drag.node, sub, pps());
  if (ed.id === sub.id) { ed.s = sub.s; ed.e = sub.e; renderEditor(); }
  updateOverlay();
});
function endDrag(e, cancelled){
  if (!drag) return;
  var d = drag; drag = null;
  if (d.mode === "bg") {
    if (!d.moved && !cancelled) {
      var r = el.ruler.getBoundingClientRect();
      if (e.clientX >= r.left - 8 && e.clientX <= r.right + 8) {
        if (playing) pause();
        setTime(xToTime(e.clientX));
      }
    }
    return;
  }
  if (!d.node) return;
  d.node.classList.remove("drg");
  if (!d.snap) {
    var sub = S.subs.find(function(x){ return x.id === d.id; });
    if (sub && !cancelled) selectSub(sub, true);
    return;
  }
  sortSubs();
  layoutTimeline();
  if (ed.id) { var s2 = S.subs.find(function(x){ return x.id === ed.id; }); if (s2) { ed.s = s2.s; ed.e = s2.e; renderEditor(); } }
  persist();
}
el.track.addEventListener("pointerup", function(e){ endDrag(e, false); });
el.track.addEventListener("pointercancel", function(e){ endDrag(e, true); });

function tdist(t0, t1){ var dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY; return Math.sqrt(dx*dx + dy*dy); }
el.tlScroll.addEventListener("touchstart", function(e){
  if (e.touches.length === 2) {
    var mid = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    pinch = { d: tdist(e.touches[0], e.touches[1]), z: zoom, anchorX: mid - el.tlScroll.getBoundingClientRect().left, anchorT: xToTime(mid) };
  }
}, { passive: true });
el.tlScroll.addEventListener("touchmove", function(e){
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  var nd = tdist(e.touches[0], e.touches[1]);
  if (!nd) return;
  zoom = clamp(pinch.z * (nd / pinch.d), 1, 8);
  updateZoomChip();
  layoutTimeline();
  el.tlScroll.scrollLeft = Math.max(0, pinch.anchorT * pps() - pinch.anchorX + PAD);
}, { passive: false });
el.tlScroll.addEventListener("touchend", function(e){
  if (e.touches.length < 2) pinch = null;
}, { passive: true });

function updateZoomChip(){
  var z = Math.abs(zoom - Math.round(zoom)) < 0.05 ? String(Math.round(zoom)) : zoom.toFixed(1);
  el.zoomChip.textContent = "줌 " + z + "×";
  el.zoomChip.classList.toggle("on", zoom > 1.01);
}
function cycleZoom(){
  var i = ZOOMS.findIndex(function(z){ return Math.abs(z - zoom) < 0.05; });
  var nz = ZOOMS[(i + 1) % ZOOMS.length];
  if (i < 0) nz = 1;
  var anchorT = cur, anchorX = cur * pps() - el.tlScroll.scrollLeft + PAD;
  zoom = nz;
  updateZoomChip();
  layoutTimeline();
  el.tlScroll.scrollLeft = Math.max(0, anchorT * pps() - anchorX + PAD);
  toast(nz === 1 ? "타임라인 전체" : "줌 " + nz + "배");
}

      if (s) cmd = "✂️ 이 구간(" + fmt(s.s) + "~" + fmt(s.e) + "초) 컷 편집해줘";
    }
    var v = taA.value.trim();
    taA.value = v ? (v + "\n" + cmd) : cmd;
    askText = taA.value;
    taA.focus();
    taA.setSelectionRange(taA.value.length, taA.value.length);
    refreshAsk();
  });
  $("askSw").addEventListener("click", function(){
    askWithSubs = !askWithSubs;
    this.classList.toggle("on", askWithSubs);
    refreshAsk();
  });
  $("askCopy").addEventListener("click", function(){ copyAsk(this); });
  $("askShare").addEventListener("click", shareAsk);
  refreshAsk();
}
function refreshAsk(){
  var p = $("askPrev"); if (!p) return;
  var txt = buildAskPayload();
  var h = "";
  txt.split("\n").forEach(function(l, i){
    if (i === 0 || /^\[/.test(l)) h += '<span class="h">' + esc(l) + "</span>\n";
    else h += esc(l) + "\n";
  });
  p.innerHTML = h;
  var c = $("askCnt"); if (c) c.textContent = askWithSubs ? (S.subs.length + "개 포함") : "자막 제외";
  var cp = $("askCopy"); if (cp) cp.textContent = askWithSubs ? "📋 요청 + 편집안 전체 복사" : "📋 요청만 복사";
}
function copyAsk(btn){
  var txt = buildAskPayload();
  var done = function(){
    toast("복사했어요 · 채팅창에 붙여넣기");
    if (btn) { btn.classList.add("flash"); setTimeout(function(){ btn.classList.remove("flash"); }, 520); }
  };
  var fallback = function(){
    var ta2 = document.createElement("textarea");
    ta2.value = txt;
    ta2.style.cssText = "position:fixed;top:50%;left:-9999px;opacity:0;";
    document.body.appendChild(ta2);
    ta2.focus(); ta2.select(); ta2.setSelectionRange(0, txt.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    ta2.remove();
    if (ok) done(); else toast("복사가 막혔어요 · 미리보기를 길게 눌러 복사해 주세요");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(fallback);
  else fallback();
}
function shareAsk(){
  var txt = buildAskPayload();
  if (navigator.share) navigator.share({ title: S.name + " 참외 요청", text: txt }).catch(function(){});
  else copyAsk($("askCopy"));
}
el.btnAsk.addEventListener("click", openAsk);

   내보내기

el.btnExport.addEventListener("click", function(){
  if (playing) pause();
  openSheet("내보내기",
    '<label class="lbl">프로젝트 이름</label>' +
    '<input class="fld" id="expName" value="' + esc(S.name) + '" spellcheck="false">' +
    '<label class="lbl">편집안 · ' + S.subs.length + "개 · " + fmt(S.dur) + '초</label>' +
    '<textarea class="exp" id="expText" readonly>' + esc(buildText()) + "</textarea>" +
    '<div class="btns">' +
      '<button class="pri" data-x="copy">📋 텍스트 복사</button>' +
      '<button data-x="share">↗ 공유</button>' +
      '<button data-x="json">⬇ JSON</button>' +
      '<button data-x="srt">⬇ SRT</button>' +
    "</div>" +
    '<div class="note">타임코드·제목·스타일이 모두 담깁니다. / 는 줄바꿈 위치예요.</div>'
  );
  var inp = $("expName");
  if (inp) inp.addEventListener("input", function(){

});

function loadSubFile(file){
  var rd = new FileReader();
  rd.onload = function(){
    var txt = String(rd.result || "");
    var isJson = /\.json$/i.test(file.name) || /^\s*[\[{]/.test(txt);
    var rows = isJson ? parseJSON(txt) : parseSRT(txt);
    if (!rows || !rows.length) { toast("자막을 읽지 못했어요 (JSON/SRT 확인)"); return; }
    pushUndo();
    S.subs = rows.map(function(r){ return { id: uid++, s: r2(r[0]), e: r2(r[1]), t: String(r[2]) }; });
    sortSubs();
    S.name = file.name.replace(/\.[^.]+$/, "");
    var lastEnd = S.subs.length ? S.subs[S.subs.length-1].e : 0;
    if (lastEnd > S.dur) S.dur = r2(lastEnd + 0.5);
    ed = { mode: "none", id: null, s: 0, e: 0, t: "", dirty: false };
    layoutTimeline(); syncEditor(); persist();
    toast(S.subs.length + "개 자막을 불러왔어요");
  };
  rd.readAsText(file, "utf-8");
}
function parseJSON(txt){
  var o; try { o = JSON.parse(txt); } catch(e){ return null; }
  var arr = Array.isArray(o) ? o : (o.subtitles || o.subs || o.segments || o.items || o.cues || []);
  if (!Array.isArray(arr)) return null;
  var out = [];
  arr.forEach(function(x){
    if (Array.isArray(x)) { if (x.length >= 3) out.push([Number(x[0]), Number(x[1]), x[2]]); return; }
    if (!x || typeof x !== "object") return;
    var s = pick(x, ["start","s","from","begin","startTime","start_time"]);
    var e = pick(x, ["end","e","to","finish","endTime","end_time"]);
    var t = pick(x, ["text","t","caption","content","ko","line"]);
    if (t === undefined && Array.isArray(x.lines)) t = x.lines.join(" / ");
    if (s === undefined || e === undefined || t === undefined) return;
    out.push([num(s), num(e), String(t).replace(/\n/g, " / ")]);
  });
  return out.filter(function(r){ return isFinite(r[0]) && isFinite(r[1]) && r[2]; });
}
function pick(o, keys){ for (var i=0;i<keys.length;i++) if (o[keys[i]] !== undefined && o[keys[i]] !== null) return o[keys[i]]; return undefined; }
function num(v){
  if (typeof v === "number") return v;
  var s = String(v).trim();
  if (s.indexOf(":") >= 0) {
    var p = s.replace(",", ".").split(":").map(Number);
    if (p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
    if (p.length === 2) return p[0]*60 + p[1];
  }
  return parseFloat(s);
}
function srtSec(s){
  s = s.trim();
  var m = s.match(/(\d+):(\d+):(\d+)[,.](\d+)/);
  if (m) return (+m[1])*3600 + (+m[2])*60 + (+m[3]) + (+m[4])/Math.pow(10, m[4].length);
  m = s.match(/(\d+):(\d+)[,.](\d+)/);
  if (m) return (+m[1])*60 + (+m[2]) + (+m[3])/Math.pow(10, m[3].length);
  return parseFloat(s);
}
function parseSRT(txt){
  var out = [];
  txt.replace(/\r/g, "").split(/\n{2,}/).forEach(function(b){
    var ls = b.split("\n").filter(function(l){ return l.trim() !== ""; });
    if (!ls.length) return;
    var idx = 0;
    if (/^\d+$/.test(ls[0].trim())) idx = 1;
    if (!ls[idx] || ls[idx].indexOf("-->") < 0) return;
    var parts = ls[idx].split("-->");
    var s = srtSec(parts[0]), e = srtSec(parts[1]);
    var body = ls.slice(idx+1).join(" / ").trim();
    if (body && isFinite(s) && isFinite(e)) out.push([s, e, body]);
  });
  return out;
}

function buildText(){
  var out = [];
  out.push("# " + S.name + " · " + fmt(S.dur) + "초 · 자막 " + S.subs.length + "개");
  out.push("상단 제목: " + (splitLines(S.title).join(" / ") || "(없음)"));
  out.push("자막 스타일: " + STYLE_NAME[S.style] + " · 높이 " + S.subY + "%");
  out.push("");
  S.subs.forEach(function(s){ out.push(fmt(s.s) + "~" + fmt(s.e) + " | " + splitLines(s.t).join(" / ")); });
  return out.join("\n");
}
function buildJSON(){
  return JSON.stringify({
    name: S.name, duration: r2(S.dur), title: splitLines(S.title), style: S.style, subtitle_y: S.subY,
    subtitle_count: S.subs.length,
    subtitles: S.subs.map(function(s){ return { start: r2(s.s), end: r2(s.e), text: s.t, lines: splitLines(s.t) }; })
  }, null, 2);
}
function tc(t){
  var h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = Math.floor(t%60);
  var ms = Math.round((t - Math.floor(t)) * 1000);
  if (ms === 1000) { ms = 0; s += 1; }
  function p2(n){ return (n<10?"0":"")+n; }
  return p2(h) + ":" + p2(m) + ":" + p2(s) + "," + ("00"+ms).slice(-3);
}
function buildSRT(){
  var out = [];
  S.subs.forEach(function(s, i){
    out.push(String(i+1));
    out.push(tc(s.s) + " --> " + tc(s.e));
    out.push(splitLines(s.t).join("\n"));
    out.push("");
  });
  return out.join("\n");
}
function slug(){ return (S.name || "자막").replace(/[\\/:*?"<>|]+/g, "_").replace(/\s+/g, "_").slice(0, 60); }
function download(ext, mime, body){
  try {
    var blob = new Blob([body], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = slug() + ext;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 3000);
    toast(ext.slice(1).toUpperCase() + " 다운로드");
  } catch(e){ toast("다운로드가 막혔어요 · 텍스트 복사를 사용해 주세요"); }
}
function doCopy(){
  var txt = buildText();
  var done = function(){ toast("복사했어요 · 붙여넣기 하세요"); };
  var fb = function(){
    var ta2 = $("expText");
    if (ta2) { ta2.removeAttribute("readonly"); ta2.focus(); ta2.select(); ta2.setSelectionRange(0, 999999); }
    var ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    if (ta2) ta2.setAttribute("readonly", "readonly");
    toast(ok ? "복사했어요 · 붙여넣기 하세요" : "위 텍스트를 길게 눌러 복사해 주세요");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(fb);
  else fb();
}
function doShare(){
  var txt = buildText();
  if (navigator.share) navigator.share({ title: S.name + " 자막", text: txt }).catch(function(){});
  else doCopy();
}

/* ============================================================
   키보드
   ============================================================ */
document.addEventListener("keydown", function(e){
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
  if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z")) { e.preventDefault(); undo(); return; }
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); nudge(e.shiftKey ? -0.5 : -0.1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); nudge(e.shiftKey ? 0.5 : 0.1); }
  else if (e.key === "s" || e.key === "S") { e.preventDefault(); doSplit(); }
  else if (e.key === "n" || e.key === "N") { e.preventDefault(); newAt(cur, true); el.ta.focus(); }
  else if (e.key === "Escape") closeSheet();
});

function boot(){
  var restored = restore();
  if (!restored) loadSample();
  applyStyle(); renderTitle();
  updateSpeedChip(); updateZoomChip();
  layoutStage();
  layoutTimeline();
  setTime(0, true);
  syncEditor();
  updateOverlay();
  if (restored) setTimeout(function(){ toast("이전 편집본을 불러왔어요"); }, 800);
  requestAnimationFrame(frame);
}
function updateSpeedChip(){
  var r = SPEEDS[speedIdx];
  el.speedChip.textContent = "속도 " + (r === 1 ? "1×" : r + "×");
  el.speedChip.classList.toggle("on", r !== 1);
  try { el.video.playbackRate = r; } catch(e){}
}
boot();
